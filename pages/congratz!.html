<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        .message {
            text-align: center;
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.5rem;
            line-height: 1.6;
            max-width: 600px;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fff;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Congratulations Emily! 🎉</h1>
        <p>Even without a bootcamp, you've always been full-stack friend to me <3</p>
    </div>

    <script>
        function createConfetti() {
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            
            const startX = Math.random() * window.innerWidth;
            const startY = -10;
            
            confetti.style.left = startX + 'px';
            confetti.style.top = startY + 'px';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
            
            document.body.appendChild(confetti);
            
            let angle = Math.random() * Math.PI * 2;
            let velocity = 3 + Math.random() * 2;
            let rotationSpeed = (Math.random() - 0.5) * 10;
            let rotation = 0;
            let opacity = 1;
            
            function animate() {
                const x = parseFloat(confetti.style.left);
                const y = parseFloat(confetti.style.top);
                
                confetti.style.left = (x + Math.cos(angle) * velocity) + 'px';
                confetti.style.top = (y + Math.sin(angle) * velocity + 1) + 'px';
                
                velocity *= 0.99;
                rotation += rotationSpeed;
                opacity -= 0.005;
                
                confetti.style.transform = `rotate(${rotation}deg)`;
                confetti.style.opacity = opacity;
                
                if (y < window.innerHeight && opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    confetti.remove();
                }
            }
            
            requestAnimationFrame(animate);
        }

        // Create confetti continuously
        setInterval(createConfetti, 50);
    </script>
</body>
</html>
